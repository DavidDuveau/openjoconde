# Pile complète : base PostgreSQL, API, front (nginx, qui relaie /api vers l'API).
#   cp .env.example .env   (puis renseigner POSTGRES_PASSWORD et API_KEY)
#   docker compose up -d --build
# Le front est le seul service publié : http://localhost:${FRONT_PORT:-8080}
name: openjoconde

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: openjoconde
      POSTGRES_DB: openjoconde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseigner POSTGRES_PASSWORD dans .env}
      # Collationnement ICU français : tri correct des titres (voir README)
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=fr-FR
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openjoconde -d openjoconde"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [interne]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: openjoconde-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Database=openjoconde;Username=openjoconde;Password=${POSTGRES_PASSWORD}
      # Schéma créé et mis à jour au démarrage (verrou consultatif : une seule instance migre à la fois)
      Database__MigrateOnStartup: "true"
      Security__ApiKey: ${API_KEY:?Renseigner API_KEY dans .env}
      # nginx transmet l'adresse du visiteur : la limite de requêtes s'applique par visiteur. L'API n'est joignable que par
      # nginx, sur le réseau interne du compose, dont Docker choisit la plage : on fait confiance aux plages privées
      ForwardedHeaders__KnownNetworks__0: 10.0.0.0/8
      ForwardedHeaders__KnownNetworks__1: 172.16.0.0/12
      ForwardedHeaders__KnownNetworks__2: 192.168.0.0/16
      Sync__CheckForUpdatesOnStartup: ${SYNC_ON_STARTUP:-false}
      Sync__IntervalHours: ${SYNC_INTERVAL_HOURS:-24}
      Enrichment__Enabled: ${ENRICHMENT_ENABLED:-false}
    # Mesuré (échantillons toutes les 20 s) : pic de 772 Mo à la première synchronisation, 1 046 Mo à une synchronisation forcée
    # (1,18 M de notices) ; 2 Go laissent une marge d'environ x2
    mem_limit: ${API_MEMORY_LIMIT:-2g}
    volumes:
      - synctemp:/data/temp
    healthcheck:
      # L'image aspnet n'a ni curl ni wget : sonde par une connexion TCP au port de l'API
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [interne]

  front:
    build:
      context: .
      dockerfile: docker/front.Dockerfile
    image: openjoconde-front
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: api:8080
    ports:
      - "${FRONT_PORT:-8080}:8080"
    networks: [interne]

volumes:
  pgdata:
  synctemp:

networks:
  interne:
