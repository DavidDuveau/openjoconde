# Monté par docker-compose.https.yml : nginx reprend l'adresse du visiteur transmise par Caddy (X-Forwarded-For)
# quand elle vient du réseau privé du compose, dont Docker choisit la plage.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
