# HTTPS automatique devant la pile : Caddy reçoit les visiteurs sur les ports 80 et 443, le front n'est plus publié.
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
# Renseigner DOMAINE dans .env (nom de domaine public dont l'enregistrement DNS pointe vers ce serveur, ou localhost pour essayer).
services:
  front:
    ports: !reset []
    volumes:
      # nginx croit X-Forwarded-For seulement quand il vient de Caddy (réseau privé du compose)
      - ./docker/nginx-realip.conf:/etc/nginx/realip/proxy.conf:ro

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    depends_on:
      front:
        condition: service_healthy
    environment:
      DOMAINE: ${DOMAINE:?Renseigner DOMAINE dans .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificats : à conserver, Let's Encrypt limite le nombre d'émissions
      - caddy_data:/data
      - caddy_config:/config
    networks: [interne]

volumes:
  caddy_data:
  caddy_config:
