name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  titre-pr:
    # Le commit de fusion reprend le titre de la PR : avec un préfixe feat:/fix:, release-please compterait deux fois le
    # changement (le commit de la branche et celui de la fusion). Le préfixe se met sur le commit, pas sur le titre de PR.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - name: Le titre de la PR n'a pas de préfixe de commit conventionnel
        env:
          TITRE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITRE" | grep -Eq '^(feat|fix|perf|revert|docs|refactor|test|build|ci|chore|style)(\([a-zA-Z0-9_ ,/-]*\))?!?:'; then
            echo "::error::Le titre de la PR commence par un préfixe conventionnel (« $TITRE ») : le changelog compterait le changement deux fois. Retirez le préfixe (ex. « Favoris dans le navigateur (US-COMPTE-04) »)."
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: "Test_Passw0rd"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENJOCONDE_TEST_POSTGRES: "Host=localhost;Port=5432;Username=postgres;Password=Test_Passw0rd"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore OpenJoconde.sln
      - run: dotnet build OpenJoconde.sln --no-restore --configuration Release
      - name: Le modèle EF correspond aux migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Backend/OpenJoconde.Infrastructure --startup-project src/Backend/OpenJoconde.API --no-build --configuration Release
      - name: Tests et couverture
        run: dotnet test OpenJoconde.sln --no-build --configuration Release --settings coverage.runsettings --results-directory ./TestResults
      - name: Couverture du back au moins 85 %
        run: python3 scripts/verifier-couverture-back.py TestResults/*/coverage.cobertura.xml
      - name: Couverture du code modifié au moins 85 % (pull request)
        if: github.event_name == 'pull_request'
        run: |
          pip install diff-cover
          diff-cover TestResults/*/coverage.cobertura.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json
      - run: npm ci
      - name: Tests unitaires et couverture au moins 85 % (seuils dans vitest.config.ts)
        run: npm run test:coverage
      - name: Couverture du code modifié au moins 85 % (pull request)
        if: github.event_name == 'pull_request'
        run: |
          pip install diff-cover
          diff-cover coverage/cobertura-coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=85
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: "Test_Passw0rd"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_PG_PASSWORD: "Test_Passw0rd"
    defaults:
      run:
        working-directory: src/Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json
      - run: dotnet tool restore
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout (API, base et front jetables)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: src/Frontend/test-results
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Les images de l'API et du front se construisent et fonctionnent ensemble
        run: scripts/verifier-images.sh
