name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: "Test_Passw0rd"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENJOCONDE_TEST_POSTGRES: "Host=localhost;Port=5432;Username=postgres;Password=Test_Passw0rd"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore OpenJoconde.sln
      - run: dotnet build OpenJoconde.sln --no-restore --configuration Release
      - name: Le modèle EF correspond aux migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Backend/OpenJoconde.Infrastructure --startup-project src/Backend/OpenJoconde.API --no-build --configuration Release
      - run: dotnet test OpenJoconde.sln --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json
      - run: npm ci
      - name: Tests unitaires
        run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: "Test_Passw0rd"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_PG_PASSWORD: "Test_Passw0rd"
    defaults:
      run:
        working-directory: src/Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json
      - run: dotnet tool restore
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout (API, base et front jetables)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: src/Frontend/test-results
          retention-days: 7
