name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Test_Passw0rd!"
        ports:
          - 1433:1433
    env:
      OPENJOCONDE_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Test_Passw0rd!;TrustServerCertificate=True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore OpenJoconde.sln
      - run: dotnet build OpenJoconde.sln --no-restore --configuration Release
      - run: dotnet test OpenJoconde.sln --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json
      - run: npm ci
      - run: npm run build
